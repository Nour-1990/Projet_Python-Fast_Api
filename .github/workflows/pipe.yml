name: QualityPipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Run linters
        run: flake8 app/
      - name: Run tests
        run: pytest --maxfail=1 --disable-warnings -q