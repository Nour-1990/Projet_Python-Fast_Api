name: QualityPipeline
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.13'
      - name: Run linters
        run: flake8 app.py --format=json > resultat_flake8.json
      - name: Run tests
        run: pytest app.py --cov=app --cov-report=term-missing --cov-report=json:coverage.json